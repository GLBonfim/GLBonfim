name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Executa a cada dia à meia-noite (UTC)
  workflow_dispatch:  # Permite execução manual também

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v2
        
      - name: Update README.md with new stats
        run: |
          # Atualizar URL do GitHub Stats e Top Langs com as informações mais recentes
          sed -i 's|https://github-readme-stats.vercel.app/api?username=.*|https://github-readme-stats.vercel.app/api?username=GLBonfim&show_icons=true&theme=radical&cache_seconds=60|' README.md
          sed -i 's|https://github-readme-stats.vercel.app/api/top-langs/?username=.*|https://github-readme-stats.vercel.app/api/top-langs/?username=GLBonfim&layout=compact&theme=radical|' README.md
          
          # Fazer commit e enviar as alterações
          git add README.md
          git commit -m "Atualizar GitHub Stats e Top Langs"
          git push